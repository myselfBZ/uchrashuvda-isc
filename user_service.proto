syntax = "proto3";

package user_service;


import "google/protobuf/timestamp.proto";

option go_package = "github.com/myselfBZ/uchrashuvda-isc/users";

service UserService {
  rpc Create(CreateUserRequest) returns (User);
  rpc GetByID(GetByIDRequest) returns (User); 
  rpc GetByEmail(GetByEmailRequest) returns (User); 
}

message GetByIDRequest {
  string id = 1;
}

message GetByEmailRequest {
  string email = 1;
}

message Location {
  double lat = 1;
  double lng = 2;
}

message CreateUserRequest {
  string username = 1;
  string first_name = 2;
  string last_name = 3;
  string password_text = 4;
  string email         = 5;
  google.protobuf.Timestamp birth_date = 6;
}

message User {
  string id = 1;
  string picture_path = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  string password_hash = 6;
  google.protobuf.Timestamp birth_date = 7;
  Location location = 8;   
  string email = 9;
}
